name: "Dependency Review"
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Dependency Review"
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high # Fail on high, critical
          # p3-challenger 0.4.3-succinct, pinned by every SP1 release; remove once SP1 ships a fixed build.
          allow-ghsas: GHSA-vj64-rjf3-w3v7
