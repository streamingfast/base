[package]
name = "base-reth-node"
description = "Base Reth Binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "base-reth-node"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# workspace
base-cli-utils.workspace = true
base-node-runner.workspace = true
base-firehose-flashblocks.workspace = true

# reth
base-reth-cli.workspace = true
reth-cli-util.workspace = true
reth-chainspec.workspace = true
reth-chain-state.workspace = true
reth-engine-primitives.workspace = true
base-execution-cli = { workspace = true, features = ["otlp"] }

# cli
url.workspace = true
clap.workspace = true

# firehose
reth-firehose.workspace = true
firehose-tracer.workspace = true

# async
tokio.workspace = true
tokio-stream.workspace = true

# tracing
tracing.workspace = true

[features]
default = [ "asm-keccak", "jemalloc", "keccak-cache-global" ]
asm-keccak = [ "base-execution-cli/asm-keccak" ]
keccak-cache-global = [ "base-execution-cli/keccak-cache-global" ]
jemalloc = [ "base-execution-cli/jemalloc", "reth-cli-util/jemalloc" ]
jemalloc-prof = [
	"base-execution-cli/jemalloc-symbols",
	"jemalloc",
	"reth-cli-util/jemalloc-prof",
]
