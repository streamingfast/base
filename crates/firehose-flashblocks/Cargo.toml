[package]
name = "base-firehose-flashblocks"
description = "Firehose tracing for pre-canonical flashblock partial blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# base
base-flashblocks.workspace = true
base-common-chains.workspace = true
base-execution-evm.workspace = true
base-execution-firehose.workspace = true
base-common-flashblocks.workspace = true
base-common-evm = { workspace = true, features = ["reth"] }
base-common-consensus = { workspace = true, features = ["reth"] }

# reth + firehose
reth-evm.workspace = true
reth-revm.workspace = true
reth-firehose.workspace = true
reth-provider.workspace = true
reth-chainspec.workspace = true
firehose-tracer.workspace = true
reth-primitives-traits.workspace = true

# revm
revm-database.workspace = true

# alloy
alloy-evm.workspace = true
alloy-eips.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true

# async
tokio = { workspace = true, features = ["rt", "sync"] }

# misc
url.workspace = true
tracing.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# base
base-flashblocks.workspace = true
base-execution-chainspec.workspace = true

# reth
reth-trie.workspace = true
reth-storage-errors.workspace = true
reth-db-models.workspace = true
reth-primitives-traits.workspace = true
reth-revm = { workspace = true, features = ["test-utils"] }

# alloy
alloy-genesis.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-network.workspace = true

# revm
revm.workspace = true

# async + ws
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures.workspace = true

# serialization
serde_json.workspace = true

# protobuf decoding (for parsing FIRE BLOCK payload in tests)
prost.workspace = true
base64.workspace = true

# assertions
pretty_assertions.workspace = true

[[test]]
name = "flashblock_sequence"
path = "tests/flashblock_sequence.rs"

